name: TaskFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - .NET 10 + PostgreSQL integration
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker is available for Testcontainers
        run: docker info

      - name: Restore dependencies
        run: dotnet restore TaskFlow.sln

      - name: Build Release
        run: dotnet build TaskFlow.sln --configuration Release --no-restore

      - name: Run unit and PostgreSQL integration tests
        run: dotnet test TaskFlow.sln --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"

  frontend:
    name: Frontend - React + TypeScript
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        run: npm test

      - name: Build production assets
        run: npm run build
